<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — DDMart Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 460px;
            margin: 3.5rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="brand">
                🛍️ DDMart <span class="brand-badge">Native C++20</span>
            </a>
            <div class="nav-actions">
                <a href="/login.html" class="nav-link">Already have an account? Log In</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:0.5rem; text-align:center;">Create an Account</h1>
            <p style="text-align:center; color:var(--text-secondary); margin-bottom:1.5rem; font-size:0.95rem;">
                Join DDMart as a Buyer or Seller
            </p>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name or Store Name</label>
                    <input type="text" id="name" required placeholder="e.g. Jane Doe or Apex Gear">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password (minimum 6 characters)</label>
                    <input type="password" id="password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role">
                        <option value="BUYER">Buyer (Browse, Cart, Order, Review)</option>
                        <option value="SELLER">Seller (List products, Manage Orders)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem; font-size:1rem; margin-top:0.5rem;">
                    Complete Registration
                </button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const data = await res.json();
                if (data.success) {
                    DDMart.showToast('Registration successful! Redirecting...', 'success');
                    setTimeout(() => {
                        if (role === 'SELLER') window.location.href = '/seller.html';
                        else window.location.href = '/';
                    }, 800);
                } else {
                    DDMart.showToast(data.error?.message || 'Registration failed', 'danger');
                }
            } catch (err) {
                DDMart.showToast('Network error during registration', 'danger');
            }
        });
    </script>
</body>
</html>
