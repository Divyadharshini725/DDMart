<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDMart — Modern C++ Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="brand">
                🛍️ DDMart <span class="brand-badge">Native C++20</span>
            </a>
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search across thousands of marketplace products...">
            </div>
            <div class="nav-actions" id="nav-actions">
                <!-- Injected by app.js -->
            </div>
        </div>
    </header>

    <main class="container">
        <div class="hero-banner">
            <div class="hero-text">
                <h1>Welcome to DDMart</h1>
                <p>High-performance multi-vendor e-commerce platform served by Native C++.</p>
            </div>
            <div style="text-align: right;">
                <span style="background:rgba(255,255,255,0.2); padding:0.5rem 1rem; border-radius:8px; font-weight:700;">
                    🚀 September 21 Release
                </span>
            </div>
        </div>

        <div class="category-pills" id="category-pills">
            <button class="pill active" data-category="">All Categories</button>
            <button class="pill" data-category="Electronics">Electronics</button>
            <button class="pill" data-category="Fashion">Fashion</button>
            <button class="pill" data-category="Home & Living">Home & Living</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h2 id="section-title" style="font-size:1.5rem; font-weight:800;">Featured Products</h2>
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <label for="sort-select" style="font-size:0.9rem; font-weight:600; color:var(--text-secondary);">Sort By:</label>
                <select id="sort-select" style="padding:0.4rem 0.8rem; border-radius:6px; border:1px solid var(--border-color); font-weight:600;">
                    <option value="created_at_desc">Newest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="rating_desc">Highest Rated</option>
                </select>
            </div>
        </div>

        <div class="product-grid" id="product-grid">
            <div style="grid-column: 1 / -1; text-align:center; padding:3rem; color:var(--text-secondary);">
                Loading catalog...
            </div>
        </div>
    </main>

    <!-- Product Detail & Review Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
                <h2 id="modal-title" style="font-size:1.4rem; font-weight:800;"></h2>
                <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <img id="modal-image" src="" alt="Product" style="width:100%; max-height:260px; object-fit:cover; border-radius:8px; margin-bottom:1rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <span id="modal-seller" class="product-seller"></span>
                <span id="modal-price" class="product-price"></span>
            </div>
            <p id="modal-description" style="color:var(--text-secondary); line-height:1.6; margin-bottom:1.2rem;"></p>
            <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1.5rem;">
                <span id="modal-stock" style="font-size:0.9rem; font-weight:600;"></span>
                <button id="modal-add-cart" class="btn btn-primary" style="margin-left:auto;">🛒 Add to Cart</button>
            </div>

            <hr style="border:0; border-top:1px solid var(--border-color); margin:1.5rem 0;">
            
            <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:1rem;">Customer Reviews</h3>
            <div id="modal-reviews-list"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let currentCategory = '';
        let currentKeyword = '';
        let currentSort = 'created_at_desc';

        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            let url = `/api/v1/products?sort=${encodeURIComponent(currentSort)}`;
            if (currentCategory) url += `&category=${encodeURIComponent(currentCategory)}`;
            if (currentKeyword) url += `&keyword=${encodeURIComponent(currentKeyword)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.success && data.data && data.data.products) {
                    renderProducts(data.data.products);
                } else {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:3rem;">No products found matching criteria.</div>';
                }
            } catch (e) {
                grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:3rem; color:red;">Failed to load products.</div>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (products.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:3rem;">No products found.</div>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card" onclick="openProductModal(${p.id})">
                    <img src="${DDMart.escapeHtml(p.image_url)}" alt="${DDMart.escapeHtml(p.name)}" class="product-image" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80'">
                    <div class="product-info">
                        <div class="product-seller">${DDMart.escapeHtml(p.seller_name || 'Seller')} &bull; ${DDMart.escapeHtml(p.category)}</div>
                        <h3 class="product-title">${DDMart.escapeHtml(p.name)}</h3>
                        <div class="product-rating">
                            ⭐ ${p.average_rating ? p.average_rating.toFixed(1) : 'New'} 
                            <span class="rating-count">(${p.review_count || 0} reviews)</span>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">${DDMart.escapeHtml(p.price_formatted)}</span>
                            <button onclick="event.stopPropagation(); addToCart(${p.id})" class="btn btn-primary" style="padding:0.4rem 0.8rem; font-size:0.85rem;">
                                + Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addToCart(productId) {
            if (!DDMart.currentUser) {
                DDMart.showToast('Please log in as a Buyer to add items to your cart', 'warning');
                setTimeout(() => window.location.href = '/login.html', 1200);
                return;
            }
            if (DDMart.currentUser.role !== 'BUYER') {
                DDMart.showToast('Only Buyer accounts can make purchases', 'warning');
                return;
            }

            try {
                const res = await fetch('/api/v1/cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId, quantity: 1 })
                });
                const data = await res.json();
                if (data.success) {
                    DDMart.showToast('Added item to cart! 🛒', 'success');
                    DDMart.updateCartBadge();
                } else {
                    DDMart.showToast(data.error?.message || 'Could not add to cart', 'danger');
                }
            } catch (e) {
                DDMart.showToast('Network error adding to cart', 'danger');
            }
        }

        async function openProductModal(id) {
            try {
                const res = await fetch(`/api/v1/products/${id}`);
                const data = await res.json();
                if (!data.success) return;

                const p = data.data;
                document.getElementById('modal-title').textContent = p.name;
                document.getElementById('modal-image').src = p.image_url;
                document.getElementById('modal-seller').textContent = `Sold by ${p.seller_name} in ${p.category}`;
                document.getElementById('modal-price').textContent = p.price_formatted;
                document.getElementById('modal-description').textContent = p.description || 'No description provided.';
                document.getElementById('modal-stock').textContent = `Stock: ${p.stock_qty} units available`;
                document.getElementById('modal-add-cart').onclick = () => addToCart(p.id);

                const revContainer = document.getElementById('modal-reviews-list');
                if (!p.reviews || p.reviews.length === 0) {
                    revContainer.innerHTML = '<p style="color:var(--text-secondary); font-size:0.9rem;">No reviews yet for this product.</p>';
                } else {
                    revContainer.innerHTML = p.reviews.map(r => `
                        <div style="background:#f8fafc; padding:0.8rem; border-radius:8px; margin-bottom:0.6rem; border:1px solid var(--border-color);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:0.3rem;">
                                <strong style="font-size:0.9rem;">${DDMart.escapeHtml(r.user_name)}</strong>
                                <span style="color:var(--accent); font-size:0.85rem;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                            </div>
                            <p style="font-size:0.85rem; color:var(--text-secondary);">${DDMart.escapeHtml(r.comment)}</p>
                        </div>
                    `).join('');
                }

                document.getElementById('product-modal').classList.add('active');
            } catch (e) {
                console.error(e);
            }
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        document.getElementById('category-pills').addEventListener('click', (e) => {
            if (e.target.classList.contains('pill')) {
                document.querySelectorAll('#category-pills .pill').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-category');
                loadProducts();
            }
        });

        document.getElementById('sort-select').addEventListener('change', (e) => {
            currentSort = e.target.value;
            loadProducts();
        });

        let searchTimeout = null;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentKeyword = e.target.value.trim();
                loadProducts();
            }, 300);
        });

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
