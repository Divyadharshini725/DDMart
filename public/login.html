<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — DDMart Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 4rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .demo-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="brand">
                🛍️ DDMart <span class="brand-badge">Native C++20</span>
            </a>
            <div class="nav-actions">
                <a href="/register.html" class="nav-link">Need an account? Sign Up</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="auth-container">
            <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:0.5rem; text-align:center;">Welcome Back</h1>
            <p style="text-align:center; color:var(--text-secondary); margin-bottom:1.5rem; font-size:0.95rem;">
                Log in to your DDMart account
            </p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.8rem; font-size:1rem; margin-top:0.5rem;">
                    Sign In
                </button>
            </form>

            <div class="demo-box">
                <div style="font-size:0.85rem; font-weight:700; color:var(--text-secondary); margin-bottom:0.6rem; text-transform:uppercase;">
                    ⚡ 1-Click Demo Accounts
                </div>
                <div style="display:flex; flex-direction:column; gap:0.4rem;">
                    <button type="button" class="btn btn-outline" style="font-size:0.85rem; padding:0.4rem 0.6rem; justify-content:flex-start;" onclick="fillAndLogin('buyer')">
                        🛒 <strong>Buyer:</strong> john.buyer@ddmart.com
                    </button>
                    <button type="button" class="btn btn-outline" style="font-size:0.85rem; padding:0.4rem 0.6rem; justify-content:flex-start;" onclick="fillAndLogin('seller')">
                        🏪 <strong>Seller:</strong> techseller@ddmart.com
                    </button>
                    <button type="button" class="btn btn-outline" style="font-size:0.85rem; padding:0.4rem 0.6rem; justify-content:flex-start;" onclick="fillAndLogin('admin')">
                        🛡️ <strong>Admin:</strong> admin@ddmart.com
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function fillAndLogin(role) {
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            if (role === 'buyer') {
                emailInput.value = 'john.buyer@ddmart.com';
                passInput.value = 'Buyer@123';
            } else if (role === 'seller') {
                emailInput.value = 'techseller@ddmart.com';
                passInput.value = 'Seller@123';
            } else if (role === 'admin') {
                emailInput.value = 'admin@ddmart.com';
                passInput.value = 'Admin@123';
            }
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    DDMart.showToast('Login successful! Redirecting...', 'success');
                    const role = data.data.role;
                    setTimeout(() => {
                        if (role === 'SELLER') window.location.href = '/seller.html';
                        else if (role === 'ADMIN') window.location.href = '/admin.html';
                        else window.location.href = '/';
                    }, 800);
                } else {
                    DDMart.showToast(data.error?.message || 'Invalid credentials', 'danger');
                }
            } catch (err) {
                DDMart.showToast('Network error during login', 'danger');
            }
        });
    </script>
</body>
</html>
