version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: ddmart_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ddmart
      MYSQL_USER: ddmart_user
      MYSQL_PASSWORD: ddmart_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DDMart C++ Marketplace Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddmart_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_TYPE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ddmart
      MYSQL_USER: ddmart_user
      MYSQL_PASSWORD: ddmart_password
      AI_CHATBOT_PROVIDER: mock
    ports:
      - "8080:8080"

volumes:
  mysql_data:
